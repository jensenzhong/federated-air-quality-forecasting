[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "aq-mas-fl"
version = "0.3.0"
description = "Auditable federated multi-agent PM2.5 forecasting on the Beijing multi-site air-quality dataset"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}
authors = [{name = "AQ-MAS-FL contributors"}]
dependencies = [
  "flwr==1.22.0",
  "numpy==1.26.4",
  "pandas==2.2.3",
  "pyarrow==15.0.2",
  "tabulate==0.9.0",
  "PyYAML==6.0.2",
  "scikit-learn==1.6.1",
  "scipy==1.12.0",
  "torch==2.7.0",
  "psutil==6.0.0",
  "openai==1.59.7",
  "jsonschema==4.23.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
  "pytest-cov==7.0.0",
  "ruff==0.12.4",
  "mypy==1.17.0",
  "types-PyYAML==6.0.12.20250516",
]

[tool.hatch.build.targets.wheel]
packages = ["aqfl"]

[tool.flwr.app]
publisher = "local-research"

[tool.flwr.app.components]
serverapp = "aqfl.federated.server_app:app"
clientapp = "aqfl.federated.client_app:app"

[tool.flwr.app.config]
method = "fedprox"
seed = 42
num-server-rounds = 30
local-epochs = 1
lr = 0.001
batch-size = 128
proximal-mu = 0.01
q = 1.0
qffl-lr = 1.0
server-lr = 0.1
config-path = "configs/base.yaml"
strict-llm = true
enforce-resource-check = true
budget-trace = ""
evaluation-split = "val"
protocol-frozen = false
client-state-isolated = false

[tool.flwr.federations]
default = "local-simulation"

[tool.flwr.federations.local-simulation]
options.num-supernodes = 12

[tool.flwr.federations.local-12]
address = "127.0.0.1:9093"
insecure = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: multi-component tests",
  "full_data: requires BEIJING_AQ_DATA_DIR and the complete UCI dataset",
  "resource: checks host resources or starts multiple processes",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true
follow_imports = "skip"

[tool.coverage.run]
source = ["aqfl"]
omit = [
  "aqfl/data/prepare.py",
  "aqfl/experiments/*",
  "aqfl/federated/client_app.py",
  "aqfl/federated/dynamic_strategy.py",
  "aqfl/federated/server_app.py",
  "aqfl/federated/strict.py",
  "aqfl/reporting/validate_run.py",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
